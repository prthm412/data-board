services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: xvector
      POSTGRES_PASSWORD: xvector_dev_pw
      POSTGRES_DB: xvector_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: xvector
      POSTGRES_PASSWORD: xvector_dev_pw
      POSTGRES_DB: xvector_test_db
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://xvector:xvector_dev_pw@db:5432/xvector_db
      SECRET_KEY: change-this-to-a-random-string
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata: